<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B-roll hero test</title>
  <style>
    :root{
      --bg:#0f1220; --ink:#eef1ff; --muted:#9aa3c7;
      --gold:#e6c07a; --gold2:#d8a94e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
      font-family:Georgia,"Times New Roman",serif;overflow:hidden}

    /* ---- crossfading background ---- */
    .broll-bg{position:fixed;inset:0;z-index:0;background:var(--bg)}
    .broll-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      opacity:0;transition:opacity 1.5s ease}
    /* darken + vignette so the hero text stays readable over any clip */
    .broll-scrim{position:absolute;inset:0;
      background:radial-gradient(120% 90% at 50% 40%, rgba(15,18,32,.35) 0%, rgba(15,18,32,.72) 60%, rgba(15,18,32,.9) 100%);}

    /* ---- hero ---- */
    .hero{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center}
    .shapes{display:flex;gap:16px;align-items:flex-end;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
    .shapes svg{width:26px;height:26px;display:block}
    h1{margin:0;font-size:clamp(34px,6vw,64px);line-height:1.06;font-weight:700;
      letter-spacing:.3px;text-shadow:0 3px 18px rgba(0,0,0,.6)}
    .cta{margin-top:8px;border:0;cursor:pointer;color:#3a2c07;font-weight:700;
      font-family:inherit;font-size:20px;padding:16px 42px;border-radius:14px;
      background:linear-gradient(180deg,var(--gold),var(--gold2));
      box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .cta:active{transform:translateY(1px)}

    /* ---- dev-only controls (remove when wiring into the app) ---- */
    .dev{position:fixed;z-index:2;left:12px;bottom:12px;display:flex;gap:8px;align-items:center;
      font-family:system-ui,sans-serif;font-size:12px;color:var(--muted)}
    .dev button{font:inherit;color:var(--ink);background:#1c2136;border:1px solid #2c3350;
      border-radius:8px;padding:6px 10px;cursor:pointer}
    .dev .kind{padding:4px 8px;border-radius:999px;background:#1c2136;border:1px solid #2c3350}
  </style>
</head>
<body>
  <div class="broll-bg">
    <video class="broll-vid" muted autoplay playsinline preload="auto"></video>
    <video class="broll-vid" muted autoplay playsinline preload="auto"></video>
    <div class="broll-scrim"></div>
  </div>

  <main class="hero">
    <div class="shapes" aria-hidden="true">
      <!-- Do triangle --><svg viewBox="0 0 24 24"><polygon points="12,3 22,21 2,21" fill="#8bd3ff"/></svg>
      <!-- Re half-circle --><svg viewBox="0 0 24 24"><path d="M2 20 A10 10 0 0 1 22 20 Z" fill="#a7f3d0"/></svg>
      <!-- Mi diamond --><svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12" fill="#fde68a"/></svg>
      <!-- Fa flag (right triangle) --><svg viewBox="0 0 24 24"><polygon points="5,3 5,21 21,21" fill="#fca5a5"/></svg>
      <!-- Sol oval --><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="11" ry="8" fill="#c4b5fd"/></svg>
      <!-- La rectangle --><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="1.5" fill="#f9a8d4"/></svg>
      <!-- Ti cone --><svg viewBox="0 0 24 24"><path d="M4 9 A8 6 0 0 1 20 9 L12 22 Z" fill="#fdba74"/></svg>
    </div>
    <h1>Learn to sing by<br>shape &amp; syllable</h1>
    <button class="cta">Start singing</button>
  </main>

  <div class="dev">
    <span class="kind" id="devKind">—</span>
    <button id="devNext">⏭ Next clip (test fade)</button>
  </div>

  <script>
    // Playlist for the fading background. Mostly shape-note clips, a few circle clips mixed in.
    // Add more files here (drop them in this folder) — the loop cycles through all of them.
    const CLIPS = [
      { src: 'broll_faithfulness_tenor_shapes.mp4',  kind: 'shapes'  },
      { src: 'broll_faithfulness_tenor_circles.mp4', kind: 'circles' },
    ];
    const FADE_S = 1.5;               // must match the CSS opacity transition
    const layers = [...document.querySelectorAll('.broll-vid')];
    const devKind = document.getElementById('devKind');
    let active = 0, idx = -1, advancing = false;

    function scheduleFadeOut(video){
      const onTime = () => {
        if (video.duration && video.currentTime >= video.duration - FADE_S - 0.15){
          video.removeEventListener('timeupdate', onTime);
          advance();
        }
      };
      video.addEventListener('timeupdate', onTime);
      video.addEventListener('ended', advance, { once:true });
    }

    function advance(){
      if (advancing) return;
      advancing = true;
      idx = (idx + 1) % CLIPS.length;
      const clip = CLIPS[idx];
      const incoming = layers[1 - active];
      incoming.src = clip.src;
      incoming.currentTime = 0;
      devKind.textContent = clip.kind + '  ·  ' + clip.src;
      const reveal = () => {
        incoming.style.opacity = 1;
        layers[active].style.opacity = 0;
        active = 1 - active;
        advancing = false;
        scheduleFadeOut(incoming);
      };
      const p = incoming.play();
      if (p && p.then) p.then(reveal).catch(reveal); else reveal();
    }

    document.getElementById('devNext').addEventListener('click', () => { advancing = false; advance(); });
    advance(); // start
  </script>
</body>
</html>
