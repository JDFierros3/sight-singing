<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shape-note staff showing Do, Re, Mi with labels">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#141b35"/>
      <stop offset="100%" stop-color="#0b0f20"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Staff (shifted up to make room for the syllables) -->
  <g stroke="#828bab" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <line x1="76" y1="132" x2="436" y2="132"/>
    <line x1="76" y1="180" x2="436" y2="180"/>
    <line x1="76" y1="228" x2="436" y2="228"/>
    <line x1="76" y1="276" x2="436" y2="276"/>
    <line x1="76" y1="324" x2="436" y2="324"/>
  </g>

  <!-- Do, Re, Mi rising, centered on Re -->
  <g transform="translate(115,234) scale(0.7)" fill="#8bd3ff">
    <polygon points="50,20 20,80 80,80"/>
  </g>
  <g transform="translate(208,205) scale(0.96)" fill="#a7f3d0">
    <path d="M26 62 A24 30 0 0 1 74 62 L26 62 Z"/>
  </g>
  <g transform="translate(322,188) scale(0.8)" fill="#fde68a">
    <polygon points="50,18 82,50 50,82 18,50"/>
  </g>

  <!-- Syllables -->
  <g fill="#e9edf8" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" text-anchor="middle">
    <text x="150" y="430">Do</text>
    <text x="256" y="430">Re</text>
    <text x="362" y="430">Mi</text>
  </g>
</svg>
