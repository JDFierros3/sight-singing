<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shape-note staff showing Do, Re, Mi">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#141b35"/>
      <stop offset="100%" stop-color="#0b0f20"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed dark field (maskable-safe: the OS rounds the corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Staff: five lines, tightened to frame the notes -->
  <g stroke="#828bab" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <line x1="80" y1="120" x2="432" y2="120"/>
    <line x1="80" y1="188" x2="432" y2="188"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="324" x2="432" y2="324"/>
    <line x1="80" y1="392" x2="432" y2="392"/>
  </g>

  <!-- Do, Re, Mi rising left-to-right, filling the width. App shapes + colors. -->
  <!-- Do — triangle, centered on the 4th line -->
  <g transform="translate(83,258) scale(1.1)" fill="#8bd3ff">
    <polygon points="50,20 20,80 80,80"/>
  </g>
  <!-- Re — half-circle dome in the space above; the hero -->
  <g transform="translate(183.5,219) scale(1.45)" fill="#a7f3d0">
    <path d="M26 62 A24 30 0 0 1 74 62 L26 62 Z"/>
  </g>
  <!-- Mi — diamond, centered on the middle line -->
  <g transform="translate(319,201) scale(1.1)" fill="#fde68a">
    <polygon points="50,18 82,50 50,82 18,50"/>
  </g>
</svg>
